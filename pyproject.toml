[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard-ai"
version = "0.1.0"
description = "Offline URL phishing classifier and look-alike domain detector"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1,<4",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "xgboost>=2,<4",
  "joblib>=1.3,<2",
  "tldextract>=5.1,<6",
  "rapidfuzz>=3.6,<4",
  "flask>=3.0,<4"
]

[project.scripts]
phishguard = "phishguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
